name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: abasto
          POSTGRES_PASSWORD: abasto_ci
          POSTGRES_DB: abasto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abasto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: abasto
      POSTGRES_PASSWORD: abasto_ci
      POSTGRES_DB: abasto
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore apps/api/Abasto.slnx
      - run: dotnet build apps/api/Abasto.slnx --no-restore --configuration Release
      - run: dotnet test apps/api/Abasto.slnx --no-build --configuration Release

  frontend:
    name: Frontend (web y panel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm toma la versión del campo "packageManager" del package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm web:build
      - run: pnpm web:build
      - run: pnpm panel:build
      # Va después de los builds porque estos generan next-env.d.ts
      - run: pnpm typecheck
